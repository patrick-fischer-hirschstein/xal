server {
    listen 80;
    server_name _;
    root /var/www/html;
    index index.php;
    charset utf-8;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        fastcgi_pass   xal-php:9000;
        fastcgi_index  index.php;
        fastcgi_param  SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include        fastcgi_params;
        fastcgi_read_timeout 120s;
    }

    location ^~ /logs/ {
        deny all;
    }

    access_log /var/log/nginx/xal-access.log;
    error_log  /var/log/nginx/xal-error.log warn;
}
