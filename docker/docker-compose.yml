services:

  php:
    build: .
    container_name: xal-php
    restart: unless-stopped
    volumes:
      - ../www:/var/www/html
    environment:
      XAL_DB_DSN:  ${XAL_DB_DSN}
      XAL_DB_USER: ${XAL_DB_USER}
      XAL_DB_PASS: ${XAL_DB_PASS}
    networks: [xal-net]

  web:
    image: nginx:alpine
    container_name: xal-nginx
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ../www:/var/www/html:ro
      - ./nginx-default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on: [php]
    networks: [xal-net]

networks:
  xal-net:
    driver: bridge
